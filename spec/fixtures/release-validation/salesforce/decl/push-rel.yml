# GRV Salesforce fixture — relationship (dot-notation) push.
#
# Same 900-row Active selection as push-base.yml, but the related-table
# values are read through the lookup: GrvRel__r.<field>. Rows with
# i >= 10 have no related record and must yield null relationship values.
# Exercises the relationship-source column contract (Object.Field sources).
declaration_version: 1
kind: push
dataset: grv_sf_fixture_rel
adapter: salesforce
connection:
  org: grv-fixture
options:
  transport: auto
tables:
  - name: grvfix
    source:
      object: GrvFix__c
      filter: GrvStatus__c = 'Active'
    partition_keys: [month]
    columns:
      - { name: id, source: Id, type: utf8 }
      - { name: name, source: Name, type: utf8 }
      - { name: status, source: GrvStatus__c, type: utf8 }
      - { name: partition_date, source: GrvPartitionDate__c, type: date32 }
      - { name: rel_id, source: GrvRel__c, type: utf8 }
      - { name: rel_name, source: GrvRel__r.Name, type: utf8 }
      - { name: rel_text, source: GrvRel__r.GrvRelText__c, type: utf8 }
      - { name: rel_decimal, source: GrvRel__r.GrvRelDecimal__c, type: "decimal128(38,6)" }
      - { name: rel_date, source: GrvRel__r.GrvRelDate__c, type: date32 }
      - { name: _month_, type: utf8, derive: { from: partition_date, format: month } }
checks:
  - { table: grvfix, not_null: [id, name, _month_] }
