[package]
name = "grv-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
cloud = ["dep:object_store", "dep:tokio", "dep:futures-util", "dep:reqwest", "dep:quick-xml", "dep:bytes", "dep:async-trait"]

[dependencies]
grv-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
chrono.workspace = true
object_store = { version = "=0.14.2", default-features = false, features = ["aws", "gcp"], optional = true }
tokio = { version = "1.51", features = ["rt-multi-thread", "sync", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tempfile.workspace = true
