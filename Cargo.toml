[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
serde_jcs = "0.1.0"
sha2 = "0.10.9"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
base64 = "0.22.1"
bytes = "1.11.1"
libc = "0.2.186"
toml = "0.8.23"
tempfile = "3.27.0"
tar = "0.4.44"
flate2 = "1.1"
jsonschema = { version = "0.33", default-features = false }
arrow-array = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-ipc = "=58.3.0"
arrow-buffer = "=58.3.0"
arrow-data = "=58.3.0"
arrow-select = "=58.3.0"
parquet = { version = "=58.3.0", default-features = false }
yaml-rust2 = { version = "=0.13.0", default-features = false }
grv-types = { path = "crates/grv-types" }
grv-adapter-api = { path = "crates/grv-adapter-api" }
grv-adapter-wire = { path = "crates/grv-adapter-wire" }
grv-adapter-sdk = { path = "crates/grv-adapter-sdk" }
grv-adapter-host = { path = "crates/grv-adapter-host" }
grv-storage = { path = "crates/grv-storage" }
grv-core = { path = "crates/grv-core" }
