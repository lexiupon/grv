name: Native conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            extension_platform: linux_amd64
          - runner: ubuntu-24.04-arm
            extension_platform: linux_arm64
          - runner: macos-15-intel
            extension_platform: osx_amd64
          - runner: macos-15
            extension_platform: osx_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
      # Process/descriptor races are exercised explicitly inside named tests.
      # Independent fork-based fixtures must not inherit another fixture's locks.
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install declared Rust minimum
        run: rustup toolchain install 1.89.0 --profile minimal --component clippy --component rustfmt
      - name: Fetch and build pinned native guard
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/duckdb/duckdb/archive/refs/tags/v1.5.6.tar.gz \
            --output "$RUNNER_TEMP/duckdb-1.5.6.tar.gz"
          python3 crates/grv-adapter-duckdb/native/build.py \
            --archive "$RUNNER_TEMP/duckdb-1.5.6.tar.gz" \
            --build "$RUNNER_TEMP/grv-native" --jobs 2
          echo "GRV_DUCKDB_NATIVE_LIB_DIR=$RUNNER_TEMP/grv-native/cmake" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Signed extension verifier adversarial tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Fetch pinned signed platform extensions
        run: |
          python3 scripts/fetch-duckdb-extensions.py \
            --output "$GITHUB_WORKSPACE/artifacts/grv-extensions" \
            --platform "${{ matrix.extension_platform }}"
      - name: Full native tests without service credentials
        run: cargo +1.89.0 test --locked --workspace --features grv-adapter-duckdb/native,grv-conformance/native-duckdb
      - name: Strict workspace lint
        run: cargo +1.89.0 clippy --locked --workspace --all-targets --features grv-adapter-duckdb/native,grv-conformance/native-duckdb -- -D warnings
      - name: Package and verify relocation
        shell: bash
        run: |
          rustup override set 1.89.0
          python3 scripts/package.py --native-dir "$GRV_DUCKDB_NATIVE_LIB_DIR" \
            --extensions-dir "$GITHUB_WORKSPACE/artifacts/grv-extensions" \
            --profile dev --output "$GITHUB_WORKSPACE/artifacts/grv-bundle"
          mv artifacts/grv-bundle artifacts/grv-relocated
          python3 scripts/verify-bundle.py artifacts/grv-relocated
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-evidence-${{ matrix.runner }}
          path: |
            artifacts/grv-relocated/bundle.json
            artifacts/grv-relocated/notices/dependencies.json
            artifacts/grv-relocated/verification.json
          if-no-files-found: ignore
