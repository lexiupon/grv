# GRV Salesforce fixture — unfiltered push (all 1,000 rows).
#
# Exercises the no-filter extraction path: full object capture, five REST
# pages of 2,000 rows, and the complete partition set 2026-07/08/09 with
# counts 3334/3333/3333 (manifest selections.all).
declaration_version: 1
kind: push
dataset: grv_sf_fixture_all
adapter: salesforce
connection:
  org: grv-fixture
options:
  transport: auto
tables:
  - name: grvfix
    source:
      object: GrvFix__c
    partition_keys: [month]
    columns:
      - { name: id, source: Id, type: utf8 }
      - { name: name, source: Name, type: utf8 }
      - { name: text, source: GrvText__c, type: utf8 }
      - { name: long_text, source: GrvLongText__c, type: utf8 }
      - { name: int_value, source: GrvInt__c, type: int64 }
      - { name: decimal_value, source: GrvDecimal__c, type: "decimal128(38,10)" }
      - { name: date_value, source: GrvDate__c, type: date32 }
      - { name: datetime_value, source: GrvDateTime__c, type: "timestamp(us,UTC)" }
      - { name: picklist, source: GrvPicklist__c, type: utf8 }
      - { name: bool_value, source: GrvBool__c, type: bool }
      - { name: formula, source: GrvFormula__c, type: utf8 }
      - { name: partition_date, source: GrvPartitionDate__c, type: date32 }
      - { name: status, source: GrvStatus__c, type: utf8 }
      - { name: rel_id, source: GrvRel__c, type: utf8 }
      - { name: _month_, type: utf8, derive: { from: partition_date, format: month } }
checks:
  - { table: grvfix, not_null: [id, name, _month_] }
